[project]
name = "project-name"
version = "0.0.1"
description = "A Telegram bot built with botspot"
readme = "README.md"
authors = [
    {name = "Petr Lavrov", email = "me@petrlavrov.com"},
]
requires-python = ">=3.12,<4.0"
dependencies = [
    "calmlib @ git+https://github.com/calmmage/calmlib.git@main",
    "botspot @ git+https://github.com/calmmage/botspot.git@main",
    "loguru>=0.7",
    "toml>=0.10",
    "python-dotenv",
    "pydantic>=2.11,<3.0",
    "pydantic-settings>=2.11,<3.0",
    "motor",
    "apscheduler>=3.10.4,<4.0.0",
    "litellm>=1.63,<2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
extras = []
test = [
    "pytest>=8.3.5",
    "isort>=6.0.0,<7.0.0",
    "vulture>=2.14,<3.0",
    "pytest-cov>=6.1.1,<7.0.0",
    "pytest-asyncio>=1.0.0,<2.0.0",
    "pytest-mock>=3.14.1,<4.0.0",
    "pyupgrade>=3.20.0,<4.0.0",
    "pyright>=1.1.401,<2.0.0",
    "ruff>=0.11.12,<1.0.0",
]
docs = []
dev = [
    "jupyter>=1.0.0",
    "pre-commit>=3.8.0",
    "tqdm",
]

[tool.uv]
default-groups = ["extras", "dev", "test", "docs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
addopts = "--tb=short --no-header -v"

[tool.coverage.run]
source = ["src"]
omit = [
    "tests/*",
    "**/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
show_missing = true

[tool.ruff]
line-length = 100

[tool.pyright]
include = ["src", "tests"]

[template]
version = "3.0.0"
url = "https://github.com/calmmage/botspot-template.git"
author = "Petr Lavrov <me@petrlavrov.com>"
description = "A template for creating a bot using botspot"
